services:
  - type: web
    name: otp-attendance
    env: docker
    region: oregon
    plan: free
    dockerCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: INITIAL_ADMIN_EMAIL
        value: admin@francisxavier.ac.in
      - key: MASTER_ADMIN_PASSWORD
        value: admin@123456
      - key: ADMIN_REGISTRATION_KEY
        value: admin123
