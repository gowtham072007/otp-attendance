name: Supabase Keep-Alive

on:
  schedule:
    # Runs every 3 days at 00:00 UTC (well within the 7-day inactivity limit)
    - cron: '0 0 */3 * *'
  push:
    paths:
      - '.github/workflows/keep-alive.yml'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab anytime

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install sqlalchemy pg8000 python-dotenv

      - name: Execute direct PostgreSQL query
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/keep_alive.py

      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://efszhpwistuytcutzbgs.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "Pinging Supabase REST API with anon key..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${SUPABASE_URL}/rest/v1/" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
            echo "REST API HTTP Status: $HTTP_STATUS"
          else
            echo "Sending fallback REST ping..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${SUPABASE_URL}/rest/v1/" || true)
            echo "REST Gateway Status: $HTTP_STATUS"
          fi
